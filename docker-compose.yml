# Throwaway databases for `npm run test:db` and manual testing. Bound to localhost only.
services:
  mysql:
    image: mysql:8
    environment: { MYSQL_ROOT_PASSWORD: test, MYSQL_DATABASE: shop }
    ports: ["127.0.0.1:33306:3306"]
    volumes: ["./test/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: test, POSTGRES_DB: shop }
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["./test/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
